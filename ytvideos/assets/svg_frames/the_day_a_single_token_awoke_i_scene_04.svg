<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg-grad)" />

  <!-- Animated Vector Grids / Nodes -->
  <g stroke="#6366F1" stroke-opacity="0.15" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1760" y1="0" x2="1760" y2="1080" />
    <line x1="0" y1="200" x2="1920" y2="200" />
    <line x1="0" y1="880" x2="1920" y2="880" />
  </g>

  <!-- Center Decorative Vector Arc -->
  <circle cx="960" cy="540" r="280" fill="none" stroke="#6366F1" stroke-width="2" stroke-dasharray="12 8" opacity="0.4" />
  <circle cx="960" cy="540" r="160" fill="none" stroke="#EC4899" stroke-width="3" filter="url(#glow)" opacity="0.7" />

  <!-- Typography -->
  <text x="960" y="490" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="54" font-weight="bold" fill="#E2E8F0" letter-spacing="2">
    SCENE 4: FlashAttention Kernel Awakening
  </text>
  <text x="960" y="580" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="28" fill="#6366F1" opacity="0.9" letter-spacing="4">
    SVG CODE
  </text>

  <!-- Frame progress bar -->
  <rect x="60" y="1020" width="1800" height="6" rx="3" fill="url(#bar-grad)" />
  <text x="1860" y="1030" text-anchor="end" font-family="monospace" font-size="16" fill="#E2E8F0" opacity="0.6">
    FRAME 0004 / 0004
  </text>
</svg>